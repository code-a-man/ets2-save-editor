name: macOS

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Fetch Sparkle
        run: ./scripts/fetch-sparkle.sh "$RUNNER_TEMP/sparkle"
      - name: Build universal app
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          SPARKLE_DIR: ${{ runner.temp }}/sparkle
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            export ETS2_VERSION="${REF_NAME#v}"
          fi
          ./scripts/build.sh universal
      - name: Verify both architectures
        run: |
          app='dist/ETS2 Save Editor.app'
          for binary in "$app/Contents/MacOS/ETS2 Save Editor" "$app/Contents/Helpers/ets2-save-core"; do
            archs="$(xcrun lipo -archs "$binary")"
            [[ " $archs " == *' arm64 '* && " $archs " == *' x86_64 '* ]]
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ETS2-Save-Editor-macOS
          path: dist/ETS2-Save-Editor-macOS-universal.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.actor_id == '43219246'
    needs: build
    environment: release
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ETS2-Save-Editor-macOS
          path: dist
      - name: Fetch Sparkle
        run: ./scripts/fetch-sparkle.sh "$RUNNER_TEMP/sparkle"
      - name: Sign Sparkle update
        env:
          SPARKLE_DIR: ${{ runner.temp }}/sparkle
          SPARKLE_SIGNING_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: ./scripts/sign-appcast.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          notes=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes=(--notes-file "$notes_file")
          fi
          gh release create "$RELEASE_TAG" dist/ETS2-Save-Editor-macOS-universal.zip dist/appcast.xml \
            --verify-tag --title "ETS2 Save Editor ${RELEASE_TAG#v}" "${notes[@]}"
